name: TamaEmu
options:
  bundleIdPrefix: com.fluorescente
  deploymentTarget:
    iOS: "17.0"
packages:
  TamaCore:
    path: Packages/TamaCore
targets:
  TamaEmu:
    type: application
    platform: iOS
    sources:
      - path: TamaEmu
    dependencies:
      - package: TamaCore
        product: TamaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fluorescente.TamaEmu
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TamaEmu
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
